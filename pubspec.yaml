name: entry_ui
description: "Entry design system: theme, fonts, icons, reusable widgets and playground."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
    - family: BananaGrotesk
      fonts:
        - asset: fonts/banana_grotesk/BananaGrotesk-Thin.otf
          weight: 100
        - asset: fonts/banana_grotesk/BananaGrotesk-Extralight.otf
          weight: 200
        - asset: fonts/banana_grotesk/BananaGrotesk-Light.otf
          weight: 300
        - asset: fonts/banana_grotesk/BananaGrotesk-Medium.otf
          weight: 500
        - asset: fonts/banana_grotesk/BananaGrotesk-Bold.otf
          weight: 700
        - asset: fonts/banana_grotesk/BananaGrotesk-Extrabold.otf
          weight: 800
